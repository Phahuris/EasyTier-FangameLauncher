name: EasyTier GUI Portable

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build-gui:
    runs-on: windows-latest

    env:
      TARGET: x86_64-pc-windows-msvc
      GUI_TARGET: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: x86_64-pc-windows-msvc
          gui: true
          pnpm: true
          pnpm-build-filter: ''
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "gui-portable-x64"
          cache-targets: "false"

      - name: Copy Windows runtime DLLs
        run: |
          find "./easytier/third_party/x86_64" -maxdepth 1 -type f \( -name "*.dll" -o -name "*.sys" \) -exec cp {} ./easytier-gui/src-tauri/ \; || true

      - name: Build GUI without installer
        run: |
          cd easytier-gui
          pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle

      - name: Create portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $release = ".\easytier-gui\src-tauri\target\x86_64-pc-windows-msvc\release"
          $package = ".\EasyTier-FangameLauncher-Windows-x64-Portable"

          New-Item -ItemType Directory -Force $package | Out-Null

          Copy-Item "$release\*.exe" $package -Force
          Copy-Item ".\easytier-gui\src-tauri\*.dll" $package -Force -ErrorAction SilentlyContinue
          Copy-Item ".\easytier-gui\src-tauri\*.sys" $package -Force -ErrorAction SilentlyContinue

          Compress-Archive -Path "$package\*" -DestinationPath ".\EasyTier-FangameLauncher-Windows-x64-Portable.zip" -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: EasyTier-FangameLauncher-Windows-x64-Portable
          path: EasyTier-FangameLauncher-Windows-x64-Portable.zip
